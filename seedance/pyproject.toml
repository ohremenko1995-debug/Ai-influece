[project]
name = "seedance-gateway"
version = "0.1.0"
description = "Cost-aware gateway for ByteDance Seedance 2.5 video generation"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "httpx>=0.28,<0.29",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.13,<3",
    "typer>=0.20,<0.21",
    "rich>=14.0,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "respx>=0.22,<0.23",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
]

[project.scripts]
seedance = "seedance.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seedance"]

# ---------------------------------------------------------------------------
# Ruff — same rule set as apps/api so the two projects stay stylistically one.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "PT",
    "RET", "SIM", "BLE", "ARG", "PTH", "ERA", "PL", "RUF", "ASYNC", "S",
]
ignore = [
    # Typer declares CLI defaults as function-call values; that is the framework idiom.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on magic numbers, use asserts by definition, carry fake
# credentials as fixtures, build records through wide keyword-only helpers, and
# touch the filesystem inside async tests where blocking is not a concern.
"tests/*" = ["S101", "S105", "S106", "PLR2004", "PLR0913", "ASYNC230", "ASYNC240"]
# The CLI is the one place allowed to write to stdout, and a command's options
# are its interface — collapsing them into an object would only hide them.
"seedance/cli.py" = ["T20", "PLR0913", "PLR0917"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["seedance", "tests"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
