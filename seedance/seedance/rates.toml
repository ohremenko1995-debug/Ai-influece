# ---------------------------------------------------------------------------
# Seedance 2.5 price table.
#
# Every number below is a published list price together with the date it was
# read and the page it came from. Prices for this model moved twice between
# 2.0 and 2.5 and several providers run promos with an end date, so this file
# is data, not truth: re-read the provider console before a large run and bump
# `checked_at`.
#
# A resolution that is missing from a provider is missing on purpose. The
# estimator refuses to price what it has not been told rather than guessing —
# an invented rate is worse than an error, because you only find out when the
# invoice arrives.
# ---------------------------------------------------------------------------

# Frame geometry ByteDance bills at. Derived from its own published examples:
# 5 s of 16:9 720p at $10.70/M tokens comes to $1.156 only if the frame is
# 1280x720 and the divisor is 1024 (see tests/test_pricing.py).
[resolutions.480p]
width = 854
height = 480

[resolutions.720p]
width = 1280
height = 720

[resolutions.1080p]
width = 1920
height = 1080

# ---------------------------------------------------------------------------
# First-party channels
# ---------------------------------------------------------------------------
[providers.modelark]
label = "BytePlus ModelArk (direct, international)"
billing = "token"
model_id = "dreamina-seedance-2-5-260628"
checked_at = "2026-08-26"
source = "https://docs.byteplus.com/en/docs/ModelArk/2607688"
notes = "Billed on output only: prompt, first frame and reference images are free, and audio carries no charge."
usd_per_million_tokens = 10.70
usd_per_million_tokens_with_video = 6.40
# 1080p tokens bill at a slightly higher per-token rate than 480p/720p: the
# published $2.843 per 5 s does not fall out of the flat $10.70/M.
[providers.modelark.usd_per_million_tokens_by_resolution]
"1080p" = 11.70

