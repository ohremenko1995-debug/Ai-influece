[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Sequential, readable filenames. Revision ids are set by hand to match
# (0001, 0002, ...) so the order of migrations is obvious from `ls`.
file_template = %%(rev)s_%%(slug)s

# The database URL is resolved in alembic/env.py from application settings, so it
# is never duplicated here and never committed to version control.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
