[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "identity-lock"
version = "0.1.0"
description = "Measurable identity consistency for generated character imagery"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
comfyui = ["httpx>=0.27"]
dev = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
]

[project.scripts]
identitylock = "identitylock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
identitylock = ["py.typed", "reporting/assets/*.css", "api/static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "N",                # pep8-naming
    "UP",               # pyupgrade
    "B",                # bugbear
    "A",                # builtins shadowing
    "C4",               # comprehensions
    "SIM",              # simplify
    "TID",              # tidy imports
    "PTH",              # use pathlib
    "RUF",
]
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = []
warn_unreachable = true
disallow_any_unimported = false

[[tool.mypy.overrides]]
# Optional backends. Their packages are large (torch, onnxruntime) and are not
# installed in CI; the adapters are still type-checked against everything else.
module = ["uvicorn.*", "open_clip.*", "torch.*", "insightface.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
    # starlette's TestClient warns about httpx at import time; the warning is about
    # starlette's own future, not about anything this project does.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:",
]
